name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: takes_reply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d takes_reply_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TAKES_REPLY_TEST_DATABASE_URL: postgres://test:test@localhost:5432/takes_reply_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.11
          cache: true
      - run: go test ./...
